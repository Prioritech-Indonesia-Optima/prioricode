        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .cmd {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.9rem 4.6rem 0.9rem 1rem;
        overflow-x: auto;
        scrollbar-width: none;
        transition: border-color 0.14s ease;
      }
      :root[data-theme="light"] .cmd {
        background: var(--bg-soft);
      }
      .cmd::-webkit-scrollbar {
        display: none;
      }
      .cmd:hover,
      .cmd:focus-within {
        border-color: var(--line-strong);
      }
      .cmd .prompt {
        color: var(--accent-ink);
        font-family: var(--mono);
        -webkit-user-select: none;
        user-select: none;
        flex-shrink: 0;
      }
      .cmd code {
        font-family: var(--mono);
        font-size: clamp(0.7rem, 1.7vw, 0.8rem);
        color: var(--ink);
        white-space: pre;
      }
      .copy {
        position: absolute;
        inset-inline-end: 0.45rem;
        top: 50%;
        transform: translateY(-50%);
        font: inherit;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--surface-raised);
        color: var(--ink-muted);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0.35rem 0.65rem;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.14s ease,
          color 0.14s ease,
          border-color 0.14s ease;
      }
      .cmd:hover .copy,
      .cmd:focus-within .copy {
        opacity: 1;
      }
      .copy:hover {
        color: var(--accent-ink);
        border-color: var(--accent-line);
      }
      .copy.done {
        color: var(--accent-ink);
        border-color: var(--accent-line);
        opacity: 1;
      }
      .hint {
        margin: 0.7rem 0 0;
        font-size: 0.74rem;
        color: var(--ink-faint);
      }
      .hint code {
        font-family: var(--mono);
        color: var(--ink-muted);
      }
      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 1.6rem;
      }
      .cta a {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 1.15rem;
        transition:
          border-color 0.14s ease,
          background 0.14s ease,
          transform 0.14s ease;
      }
      .cta a:hover {
        border-color: var(--line-strong);
        background: var(--accent-soft);
        transform: translateY(-1px);
      }
      .cta a.primary {
        background: linear-gradient(120deg, var(--amber), var(--amber-bright));
        color: #2a1e00;
        border-color: transparent;
        box-shadow: 0 10px 30px -12px #f9b1108c;
      }
      .cta a.primary:hover {
        background: linear-gradient(120deg, var(--amber-bright), var(--amber));
      }
      .cta svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .hero-art {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 16rem;
      }
      .hero-art .glow {
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(249, 177, 16, 0.22), transparent 65%);
        filter: blur(38px);
      }
      .ascii {
        position: relative;
        margin: 0;
        font-family: var(--mono);
        font-size: clamp(0.62rem, 1.4vw, 0.86rem);
        line-height: 1.25;
        -webkit-user-select: none;
        user-select: none;
        animation: float 7s ease-in-out infinite;
      }
      .ascii-row {
        display: block;
      }
      .ascii .c-light {
        color: var(--ink-faint);
      }
      .ascii .c-base {
        color: var(--ink-muted);
      }
      .ascii .c-accent {
        color: var(--amber);
        text-shadow: 0 0 12px rgba(249, 177, 16, 0.45);
      }
      .ascii span {
        opacity: 0;
        animation: grain 0.5s ease-out forwards;
      }
      @keyframes grain {
        0% {
          opacity: 0;
          filter: blur(2px);
        }
        to {
          opacity: 1;
          filter: blur(0);
        }
      }
      @keyframes float {
        50% {
          transform: translateY(-8px);
        }
      }
      .features {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        padding: 0 0 4.5rem;
      }
      .feature {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.3rem 1.4rem;
        transition:
          border-color 0.16s ease,
          transform 0.16s ease;
      }
      :root[data-theme="light"] .feature {
        background: #ffffffb3;
      }
      .feature:hover {
        border-color: var(--accent-line);
        transform: translateY(-3px);
      }
      .feature .icon {
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border: 1px solid var(--accent-line);
        border-radius: 9px;
        margin-bottom: 0.9rem;
      }
      .feature .icon svg {
        width: 1.05rem;
        height: 1.05rem;
      }
      .feature h2 {
        margin: 0 0 0.35rem;
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .feature p {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.6;
        color: var(--ink-muted);
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 1.4rem 0 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        font-size: 0.78rem;
        color: var(--ink-faint);
      }
      footer a {
        color: var(--ink-faint);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--accent-ink);
      }
      .ver {
        font-family: var(--mono);
        color: var(--accent-ink) !important;
        border: 1px solid var(--accent-line);
        border-radius: 999px;
        padding: 0.2rem 0.7rem;
        font-size: 0.72rem;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
        border-radius: 6px;
      }
      @media (max-width: 60rem) {
        .features {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 48rem) {
        .hero {
          grid-template-columns: 1fr;
          gap: 2.5rem;
          padding-top: 2rem;
        }
        .hero-art {
          order: -1;
          min-height: 0;
        }
        .features {
          grid-template-columns: 1fr;
        }
        .copy {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .ascii span,
        .comet .spark {
          opacity: 1;
        }
        .comet .trail {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
