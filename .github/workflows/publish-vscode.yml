name: publish-vscode

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - run: git fetch --force --tags
      - run: bun install -g @vscode/vsce

      - name: Install extension dependencies
        run: bun install
        working-directory: ./sdks/vscode

      - name: Publish
        run: |
          ./script/publish
        working-directory: ./sdks/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

      # Marked --prerelease so it never becomes "releases/latest", which the
      # curl installer resolves for CLI binaries via releases/latest/download.
      - name: Attach .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git describe --tags --match 'vscode-v*' --abbrev=0)
          version=${tag#vscode-v}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sdks/vscode/dist/prioricode.vsix --clobber
          else
            gh release create "$tag" sdks/vscode/dist/prioricode.vsix \
              --title "PrioriCode VS Code extension $version" \
              --notes "Direct .vsix download for the PrioriCode VS Code extension. Prefer installing from the VS Code Marketplace or Open VSX." \
              --prerelease
          fi
