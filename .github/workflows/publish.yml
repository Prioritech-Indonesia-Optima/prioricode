name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Check for shippable changes since last release
        id: check
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            echo "No release tags found; releasing."
            exit 0
          fi
          # Ignore commits the automation itself pushes back to main.
          new=$(git rev-list "${last}..HEAD" --grep='^sync release versions' --grep='^chore: generate' --grep='^ignore: update download stats' --invert-grep)
          if [ -z "$new" ]; then
            echo "No new changes since ${last}; skipping release."
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      up-to-date: ${{ steps.check.outputs.up-to-date }}

  secrets-check:
    # The secrets context is not allowed in if: expressions, so probe the
    # optional secrets here and expose plain outputs for downstream jobs.
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then echo "azure=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "apple=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$AUR_KEY" ]; then echo "aur=true" >> "$GITHUB_OUTPUT"; fi
    outputs:
      azure: ${{ steps.check.outputs.azure }}
      apple: ${{ steps.check.outputs.apple }}
      aur: ${{ steps.check.outputs.aur }}

  version:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.up-to-date != 'true'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          PRIORICODE_BUMP: ${{ inputs.bump || (github.event_name == 'push' && 'patch' || '') }}
          PRIORICODE_VERSION: ${{ inputs.version }}
          PRIORICODE_API_KEY: ${{ secrets.PRIORICODE_API_KEY }}
          GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        run: |
          # Compile with the AVX2 host bun, not the baseline host setup-bun
          # installs. A baseline host silently embeds its own runtime when
          # cross-compiling --target=bun-*-x64 (no AVX2 download), so the AVX2
          # and baseline archives ship identical bytes and cli-release-check
          # refuses the release. An AVX2 host builds the native target and
          # correctly downloads the baseline runtime for the baseline target.
          BUN_V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          curl -fsSL -o /tmp/bun-avx2.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_V}/bun-linux-x64.zip"
          unzip -q /tmp/bun-avx2.zip -d /tmp/bun-avx2
          export PATH="/tmp/bun-avx2/bun-linux-x64:$PATH"
          ./packages/prioricode/script/build.ts
          ./packages/cli/script/build.ts
        env:
          PRIORICODE_VERSION: ${{ needs.version.outputs.version }}
          PRIORICODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - name: Repack Windows CLI archives
        working-directory: packages/prioricode/dist
        run: |
          for d in prioricode-windows-arm64 prioricode-windows-x64 prioricode-windows-x64-baseline; do
            (cd "$d/bin" && zip -qr "../$d.zip" .)
          done

      - name: Upload Windows CLI release assets
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          cd packages/prioricode/dist
          gh release upload "v${{ needs.version.outputs.version }}" prioricode-windows-*.zip --clobber --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prioricode-cli
          path: |
            packages/prioricode/dist/prioricode-darwin*
            packages/prioricode/dist/prioricode-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prioricode-cli-windows
          path: packages/prioricode/dist/prioricode-windows*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prioricode-preview-cli
          path: packages/cli/dist/cli-*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
      - secrets-check
    runs-on: windows-latest
    if: needs.secrets-check.outputs.azure == 'true'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prioricode-cli-windows
          path: packages/prioricode/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-arm64\bin\prioricode.exe
            ${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64\bin\prioricode.exe
            ${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64-baseline\bin\prioricode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-arm64\bin\prioricode.exe",
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64\bin\prioricode.exe",
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64-baseline\bin\prioricode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/prioricode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "prioricode-windows-arm64\bin\*" -DestinationPath "prioricode-windows-arm64.zip" -Force
          Compress-Archive -Path "prioricode-windows-x64\bin\*" -DestinationPath "prioricode-windows-x64.zip" -Force
          Compress-Archive -Path "prioricode-windows-x64-baseline\bin\*" -DestinationPath "prioricode-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-arm64.zip" `
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64.zip" `
            "${{ github.workspace }}\packages\prioricode\dist\prioricode-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prioricode-cli-signed-windows
          path: |
            packages/prioricode/dist/prioricode-windows-arm64
            packages/prioricode/dist/prioricode-windows-x64
            packages/prioricode/dist/prioricode-windows-x64-baseline

  build-electron:
    needs:
      - version
      - secrets-check
    continue-on-error: true
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Mac x64 must build on an arch-matched intel runner (cross-building
          # x64 on arm64 breaks native build tooling like rollup). macos-13 is
          # the Intel label; macos-latest is arm64.
          - host: macos-13
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win --x64 --arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS' && needs.secrets-check.outputs.apple == 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && needs.secrets-check.outputs.apple == 'true'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Azure login
        if: runner.os == 'Windows' && needs.secrets-check.outputs.azure == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          PRIORICODE_VERSION: ${{ needs.version.outputs.version }}
          PRIORICODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          RUST_TARGET: ${{ matrix.settings.target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PRIORICODE_VERSION: ${{ needs.version.outputs.version }}
          PRIORICODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package
        if: needs.version.outputs.release
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          PRIORICODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          PRIORICODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="prioricode-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="prioricode-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && needs.secrets-check.outputs.azure == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\prioricode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prioricode-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  # The CLI is the primary install/upgrade path and ships independently of the
  # desktop matrix, so a scarce runner (e.g. macos-13) can't hold the release.
  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
      - secrets-check
    if: always() && !cancelled() && needs.version.result == 'success' && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prioricode-cli
          path: packages/prioricode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prioricode-cli-windows
          path: packages/prioricode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.sign-cli-windows.result == 'success'
        with:
          name: prioricode-cli-signed-windows
          path: packages/prioricode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prioricode-preview-cli
          path: packages/cli/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache apt packages (AUR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        if: needs.secrets-check.outputs.aur == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "prioricode@sst.dev"
          git config --global user.name "prioricode"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - name: Verify CLI release assets and publish checksums
        if: needs.version.outputs.release != ''
        env:
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: bun ./script/cli-release-check.ts --release "v${{ needs.version.outputs.version }}"

      - run: ./script/publish.ts
        env:
          PRIORICODE_VERSION: ${{ needs.version.outputs.version }}
          PRIORICODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # Desktop ships on its own track and waits for the full matrix (including the
  # scarce macos-13 runner). It never blocks the CLI release above.
  publish-desktop:
    needs:
      - version
      - build-electron
      - secrets-check
    if: always() && !cancelled() && needs.version.result == 'success' && needs.build-electron.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          prioricode-app-id: ${{ vars.PRIORICODE_APP_ID }}
          prioricode-app-secret: ${{ secrets.PRIORICODE_APP_SECRET }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prioricode-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Upload desktop release assets
        if: needs.version.outputs.release
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

      - name: Finalize desktop updater
        if: needs.version.outputs.release
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          PRIORICODE_VERSION: ${{ needs.version.outputs.version }}
          PRIORICODE_RELEASE: ${{ needs.version.outputs.release }}
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun ./packages/desktop/scripts/finalize-latest-json.ts
          bun ./packages/desktop/scripts/finalize-latest-yml.ts
